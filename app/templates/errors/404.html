{% extends "base.html" %}

{% block title %}Page Not Found (404) | TravelGo{% endblock %}

{% block content %}
<div class="container" style="padding: 6rem 1rem; text-align: center;">
  <div style="font-size: 5rem; margin-bottom: 1rem;">🧭</div>
  <h1 style="font-size: 2.5rem; color: var(--primary-navy); margin-bottom: 1rem;">Destination Not Found (404)</h1>
  <p style="color: var(--text-muted); max-width: 500px; margin: 0 auto 2rem; font-size: 1.1rem;">
    The page you are looking for has taken off or does not exist. Let's get you back on route.
  </p>
  <a href="{{ url_for('main.index') }}" class="btn btn-primary btn-lg">
    Return to Homepage →
  </a>
</div>
{% endblock %}
